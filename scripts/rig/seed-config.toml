# unseamless-coop — rig test seed config.
#
# `scripts/rig.sh apply` copies this to <Game>/unseamless-coop/unseamless_coop.toml so rig runs
# start from a known, reproducible config instead of the random-password default the mod writes on
# first launch. Edit freely; `apply --keep-config` leaves an existing on-disk config untouched.
#
# The one load-bearing choice here is [debug].enabled = true: it drops logging to `level` so a rig
# run captures the verbose lines (CLAUDE.md's logging rule keeps these silent by default). The
# [session].password is now the co-op trigger: with it set, lobby discovery runs on launch (creates a
# lobby + becomes host solo, finds + joins a partner's with two players), so a rig run exercises the
# real connection path. It must be 8+ chars (the mod rejects a shorter one at startup).

[gameplay]
crit_coop = true
death_debuffs = true
allow_summons = true
roam_anywhere = true
skip_splash_screens = true
# Re-enable the online multiplayer items offline (the rung-3 unblock). Listed explicitly because a rig
# run is the only way to verify the boot-time "is offline" code patch — confirm the items ungrey and no
# network-error popup fires. See docs/OFFLINE-ITEMS-FINDINGS.md > "Rig verification recipe".
enable_offline_multiplayer = true
# EXPERIMENTAL / UNVERIFIED item-gate candidate (forces the game's IsEnableOnlineMode() getter true via
# a boot patch). Listed here so the lever is discoverable, but left OFF: the recipe says do the cheap
# live read of 0x144588afc FIRST — only flip this true to test if that read shows the getter is false
# outside EAC. See docs/OFFLINE-ITEMS-FINDINGS.md > "Item-gate follow-up pass".
force_online_menu_mode = false
# EXPERIMENTAL / UNVERIFIED rung-3 lever. A direct create returns false offline because the create/join
# inners call a shared Arxan-encrypted availability gate (0x140cb4b50) before building params and bail to
# FailedToCreate/FailedToJoin. This patches the create call site so the gate's veto is ignored, letting
# create proceed to the network create. Left OFF: do the runtime-verify FIRST (write-watch on [G]+0x24 to
# see whether the gate or the network create is the reject). See docs/SESSION-DRIVE.md > "Why a direct
# create fails offline".
bypass_session_create_gate = true
append_steam_id = false
always_spectate_on_death = false
# Stay-connected disconnect-suppression gate (coop/stay_connected.rs; the SESSION-LIFECYCLE-FINDINGS
# chokepoint). OFF for RE/charting runs on purpose: session_probe's read-only leave tracer and this
# gate contend for the same leave_session entry (whichever installs first wins the site; the other
# degrades with a logged byte-check refusal), and teardown charting wants leaves observable. Flip
# true (with session_probe = false) for the dedicated rig-validation pass — findings-doc risks #1-#3.
stay_connected = false
# On (vs the shipped default of off) so a rig run actually exercises the boot-volume write path — it's
# the only verification surface for coop/features/boot_volume (the cdylib logic can't be host-tested).
boot_master_volume_enabled = true
boot_master_volume = 5

[scaling]
enemy_health = 35
enemy_damage = 0
enemy_posture = 15
boss_health = 100
boss_damage = 0
boss_posture = 20

[session]
password = "coop-test"
# Relax the session player cap (vanilla 4 open world / 6 arena) via session_player_limit_override.
max_players = 6

[save]
# Rig testing uses a DISTINCT extension on purpose: this machine's real ERSC co-op character lives in
# ER0000.co2 (ERSC's default, which is also our shipped default), and we don't want an in-development
# build reading/writing that 28MB save. ER0000.uco isolates every rig run from it. The shipped default
# stays "co2"; only this rig seed diverges.
file_extension = "uco"

[language]
override = ""

[loader]
# Our dinput8.dll is the parent loader; it loads DLLs from mods/ (which `apply` controls via
# --with-mods). Default apply leaves mods/ empty, so this logs "no extra mods" — clean observation.
enabled = true
order = []

[debug]
enabled = true
level = "debug"
forward_to_host = true
# Dev side-channel bridge on loopback (diag/rig builds only). Drive it from the host with:
#   scripts/harness.sh bridge-host 47700
bridge_port = 47700
# In-game overlay (on by default). Recovery kill-switch: set false and relaunch to run without it if
# the DX12 present-hook ever misbehaves under Proton/vkd3d.
overlay = true
# In-overlay rig-testing GUIDE: a pinned, on-screen sequence of test steps that walks the tester
# through a run (so the orchestrator doesn't round-trip "do X, now do Y"). Empty = off. Debug-only
# (diag/dev builds; stripped from release). When validating something SPECIFIC — solo, on the rig, or
# in a friend/prerelease bundle — set this to the relevant guide so the tester(s) AND you follow the
# same steps. Committed guides: "rung3-create-chart" (create-session RE; pair with session_probe = true
# below), "overlay-smoke" (guide self-test), "two-player-join" (role-tagged 2-player),
# "rig-observation" (session-observer run), "rung3-create-drive" (two-machine create-drive; see
# docs/RUNG3-DRIVE-RUNBOOK.md). See docs/RIG-GUIDES.md; author new ones per the rig-guides skill.
guide = "rung3-create-drive"
# Headless Open/Join trigger ([debug] auto_session) — deliberately NOT set here. The role is
# per-MACHINE (host on the rig, join on the Deck) but this seed is SHARED: rig.sh and deck.sh both
# re-apply it on every cycle, so a role written here would clobber the other machine's role on its
# next cycle (the both-machines-hosted footgun, 2026-07-04). Pass the role per invocation instead —
# the flag writes it into the installed config after the seed copy:
#   scripts/rig.sh  cycle --auto-session host
#   scripts/deck.sh cycle --auto-session join
# Absent = "off" (the mod default). Same gate + code path as the overlay actions; one-shot per launch.
# Which role this machine plays for an active `guide`: "host" / "join" / "solo" (default "solo"). One
# shared guide runs on every machine; each shows only the steps tagged for its role. For a two-player
# guide set "host" on the hosting machine and "join" on the joiner.
rig_role = "solo"

# Requestable diagnostic probes — all off by default. Flip on demand when chasing a specific issue
# (yourself on the rig, or ask a friend tester to set one, reproduce, and send the log). A full
# snapshot already logs at boot + on any feature panic regardless of these.
[debug.probes]
snapshot_secs = 20         # >0: also log a full diagnostic snapshot every N seconds (surfaces the
                           # `coop_connect` per-stage report so a discovery run is legible in the log)
event_flag_scan_start = 0  # event-flag scanner window start...
event_flag_scan_count = 0  # ...and how many flags to watch (0 = off). Finds the flag behind an action
                           # (e.g. set a window, rest at a grace, see which flag flips = the cure flag).
session_probe = true      # rung-3 RE: log every session lobby/protocol FSM transition + (once charted)
                           # hook the create/join initiation, all under the `session-probe:` log prefix.
                           # Flip true for a two-player create/join RE run — see docs/SESSION-RE-RUNBOOK.md.
lobby_callback_probe = false # rung-4 re-derivation probe (poll one private CreateLobby via ISteamUtils).
                           # Its question is settled (ER pumps RunCallbacks; CreateLobby works), and the
                           # real discovery driver now runs whenever a password is set, so leave it off
                           # unless re-deriving after a game/Steam update.
drive_create = true        # SEAM TEST (2026-07-04): drive create after the seam lands a real +0x708. Also
drive_join = false         # JOIN driver (joiner): drive 0x140cae640 -> TryToJoinSession -> Client. OFF for the
                           # 2026-07-06 symmetric option-a run (rung3_role forces do_join=false under
                           # symmetric_peer anyway; kept explicit). Flip true only for an asymmetric client-join run.
                           # See docs/STATE.md > "Next".
                           # installs the gate-trace hooks that arm land_socket_holder below. Pairs with
                           # gameplay.enable_offline_multiplayer = true.
join_set_established_bit = true # ★ CLIENT-JOIN FIX (2026-07-05): on the joiner, set container+0x7c0 bit 2
                           # (session-established) before drive_join so the join-created session passes the
                           # readiness gate 0x1423fd7a0 (container sub-predicate 0x1423f4330) and builds the
                           # emitter connection → runs the handshake → sends the type-5. Charted in
                           # docs/SESSION-DRIVE.md > "★ CLIENT-JOIN AIM SHEET". Host-inert (only the join driver
                           # reads it). NOT drive_establish_handler (the crash). Baseline (2026-07-05) showed the
                           # join bails before the blob-parse without this.
drive_establish_handler = true # ★ THE REPRODUCTION (2026-07-05): drive the game's own establish handler
                           # 0x1423f2820 → it builds the connection, session, AND member graph itself. WORKS
                           # OFFLINE now that drive_establish_handler seeds its input descriptor from the
                           # stood-up socketmgr's config defaults (in code) — the handler succeeds, add-member
                           # 0x1423fdf20 fires, and the host reaches a stable Host/Ingame with member[5]=the
                           # host's own SteamID64 (matches the live ERSC capture). Pair: drive_session_established
                           # OFF (below), stand_up_transport + land_socket_holder ON. See docs/SESSION-DRIVE.md >
                           # "★★ HOST-SIDE ESTABLISHMENT REPRODUCED (2026-07-05)".
stand_up_transport = true  # SEAM WORK: builds the DLNW3D transport AND (2026-07-04 pm) the socket-manager
                           # WRAPPER that [container+0x708] actually holds (0x10-byte {vtable 0x143276a00,
                           # [+8]=MTInternalThreadSteamSocketManager}) — host-setup dispatches
                           # wrapper->socketmgr->vtable[3]. Pairs with land_socket_holder, which lands the
                           # wrapper AND drives the socketmgr's full init 0x14263a9d0 (the SteamServiceImpl
                           # standup WORKS OFFLINE — the "native-builder dead end" was a misdiagnosis). Clears
                           # host-setup faults #1-#3; wall = fault #4 (socketmgr worker thread). See
                           # docs/SESSION-DRIVE.md > "HOST-SETUP DRIVE (2026-07-04 pm)".
# Two-machine game-P2P test (phase 2 of stand_up_transport): both machines' SteamID64s. Each machine
# drives the game's legacy ISteamNetworking006 P2P at whichever of these isn't its own — no manual
# Open/Join link needed. rig=76561198004789432, deck=76561198681631498.
p2p_test_peer_a = 76561198004789432
p2p_test_peer_b = 76561198681631498
fabricate_slot_array = true # rung-3 slot-array fabrication (pairs with drive_create; writes base/cap onto the
                           # live NetworkSession from inside the leg-B entry hook, only if still empty). ON for
                           # the 2026-07-03 combo run: fabricated array + a real linked peer (solo runs proved
                           # each alone insufficient). See docs/SESSION-DRIVE.md > "fabricate the array".
drive_fire_solo = true     # drive timing: true = fire solo once in-game; false = hold until the rung-2 link
                           # (+settle) for a two-machine run. NB (2026-07-04): the two-machine run proved a
                           # linked peer does NOT unblock the native build — it fails at the SteamServiceImpl
                           # standup identically to solo — so this native-builder path is a dead end either way.
set_create_veto_bit = false # rung-3 L3 lever: write bit 2 of [container+0x7c0] set before the veto vmethod
drive_session_established = false # MUST stay OFF with drive_establish_handler ON: the establish handler
                           # 0x1423f2820 calls 0x1423f4870 ITSELF as gate2 (vtable[0x68]); pre-driving it made
                           # that internal call return al=0 (idempotent "already established"), bailing before
                           # the builder. Let the establish handler own the first call. (Part of the working
                           # reproduction — see drive_establish_handler above.)
land_socket_holder = true  # SEAM WORK (next session): pairs with stand_up_transport to land our built
                           # connection at +0x708 → TryToCreateSession. Then chart what host-setup faults on.
                           # SEAM TEST (2026-07-04): build a real SocketManagerHolder@DLNR3D wrapping the
                           # stand_up_transport connection and land it at [container+0x708] (refcount=1) at the
                           # veto-vmethod hook, so the driven create's ConnectionRefInfo loop reads a valid
                           # object instead of null-derefing. Needs stand_up_transport + drive_create on. The
                           # charted finish of rung-3 create — see docs/SESSION-DRIVE.md > "SEAM CHARTED".
force_host_transition = false # SEAM CHART (2026-07-04 pm): drive 0x140cb2ae0 after TryToCreateSession to reach host-setup; the conn-graph dump (land_socket_holder) logs the walked sub-object chain BEFORE the fault. # off: proven not to stick (host setup faults on a dead connection). Left as a
                           # charted lever. SEAM TEST: after create reaches TryToCreateSession, call the game's
                           # Host writer 0x140cb2ae0 directly (sets lobby_state=Host + protocol=Ingame + host
                           # setup), so the update task takes the host-maintenance branch instead of the
                           # connection-activation branch that crashes on our incomplete connection.
force_netsession_ready = true # rung-3 reject-#1 lever (pairs with drive_create): write NetworkSession+0x10
                           # nonzero before the driven create to satisfy leg B's first reject. RIG-PROVEN
                           # INSUFFICIENT (the blocker is deeper — leg B's finalize registry/init lookup, which
                           # likely needs a real peer); kept as a charted probe. Logs the flag's pre-call value
                           # either way. See docs/SESSION-DRIVE.md > "Leg B charted".
host_skip_p2p_accept = false # ACCEPT-UNMASK (2026-07-05, runs 3-4): the host skips its own P2P accept so the
                           # game's event callbacks (0x1423fd550/560/570) fire on inbound. NOW OFF (run 8): with
                           # drive_add_peer driving the host send directly, the unmask is net-harmful — legacy
                           # ISteamNetworking006 needs the RECEIVER to have accepted the sender, so a host that
                           # doesn't accept the Deck drops the Deck->host return leg and the SYN handshake can't
                           # complete. Off = host accepts + pings again, both sides accept, handshake can close.
                           # See docs/SESSION-DRIVE.md > "RIG RESULT (run 7)".
instrument_host_accept = true # READ-ONLY host-side observation (2026-07-04): hook the host's admit-new-peer
force_gatec_accept = false # rung-3 joiner-admit lever (2026-07-05): force host admit gate-c to ACCEPT so the Deck SYN passes -> test whether admit-success + a Deck roster member follow.
                           # 0x142640e30 (logs sender SteamID + datagram size) + roster-add 0x140cb31b0 (logs
                           # players count + lobby_state). Two-machine: does the joiner's game-P2P reach the
                           # host admit path, and does the roster grow 1->2? Fires only on the receiving (host)
                           # machine; inert on the joiner. See docs/SESSION-DRIVE.md > "HOST-SIDE ADMIT/ROSTER".
drive_add_peer = true      # rung-3 JOINER-MEMBER driver (2026-07-05): host-side, drive the session-layer add-peer
                           # entry 0x1423fdc80 for the two-machine peer's SteamID once the host session is up. The
                           # member pipeline is charted + the two-machine run proved no natural producer posts the
                           # add-peer event for the Deck (its SYN reaches admit + is rejected; add-peer never fires),
                           # so we post it ourselves: pop an empty member, set member+0x80 = Deck SteamID, enqueue on
                           # the pending-conn queue; the game's per-frame pump drives its handshake. Host-only; watch
                           # `drive-add-peer` + member+0x80. See docs/SESSION-DRIVE.md > "★★ MEMBER PIPELINE CHARTED".
drive_add_peer_joiner = false # SYMMETRIC ADD-PEER (2026-07-05 night). Idea: the JOINER also drives add-peer
                           # (queues the HOST in its Client session) so both games emit real SYNs. RIG-TESTED
                           # run 9: it ENQUEUES fine (returned 1, queue grew) but ~10s later CRASHES the joiner —
                           # ACCESS_VIOLATION at eldenring.exe+0x23fc3e4 reading null +0x5f8, with 0x1423fdc80
                           # (add-peer) in the backtrace. The Client session's pump chokes on the enqueued member
                           # (a sub-object present on a Host session is null on a Client one). OFF (unsafe). The
                           # joiner needs its game to build the host connection from the host's REAL inbound SYNs
                           # (find-or-create 0x142640e30), not this. See docs/SESSION-DRIVE.md > "RIG RESULT (run 9)".
symmetric_peer = true      # ★ OPTION-A HANDSHAKE EXPERIMENT (2026-07-06): both machines host-style peers — each
                           # builds its session via establish, each drive_add_peers the OTHER, both build the other's
                           # member endpoint (member+0x130). PROVEN to build endpoints + be stable. Pair with
                           # suppress_syn below to test whether the game's own endpoints complete the handshake
                           # (member+0x152) once we stop spamming the useless 14B SYN. Run --auto-session host on
                           # BOTH machines (symmetric forces host role in code; p2p_test_peer_a/_b feed the peer so
                           # no lobby is needed). See docs/STATE.md > Next (a).
suppress_syn = true        # ★ OPTION-A (2026-07-06): stop our fabricated 14B SYN on channel 30 — it's ignored by the
                           # pump (buf[0]=14 out of type-1..8 range) and its host-admit purpose is a red herring, so
                           # it only spams channel 30 and may crowd out the game's own connect flow. Off = old SYN
                           # behavior. Pair with symmetric_peer. See docs/STATE.md > Next (a).
drive_type5 = false        # TYPE-5 SEND-DRIVE — OBSERVE-ONLY + RETIRED (runs 13-15, 2026-07-06). Driving the
                           # game's own send 0x142400df0 cold CRASHES: the endpoint's vtable slot 14 is
                           # Arxan-obfuscated (0x119930522), only valid through the game's protected control flow.
                           # The code is observe-only (logs, no send call). Superseded by send_type5 below.
send_type5 = true          # ★ THE HAND-FRAME TYPE-5 SENDER (2026-07-06) — the primary handshake-completion producer.
                           # We frame the type-5 bytes ourselves — [len-hdr][5][8B token=0][4B ticket_len][ticket],
                           # ticket = a real GetAuthSessionTicket blob — and SendP2PPacket them on channel 30 via the
                           # plain ISteamNetworking006 send, NEVER touching the Arxan-locked game send. The peer's pump
                           # reads ch30 → routes by our sender id → endpoint queue → type-5 case → validator
                           # (BeginAuthSession vs member+0x80) → member+0x152=1 → roster → players=2. Symmetric: BOTH
                           # machines send their own ticket to the other (pair with symmetric_peer + drive_add_peer,
                           # both ON above, which build the endpoints + set member+0x80). The ticket is fetched once +
                           # cached and the send retried on a throttle (it only validates after Steam's async callback,
                           # so the first sends may bounce as InvalidTicket). Watch member+0x152 / flags (0,0,1,0) via
                           # scripts/re/capture-endpoint.py and players → 2. OPEN RISK: an inner transport frame beyond
                           # the 11-bit len header (0x142642860 is Arxan-opaque) — if the plain frame doesn't dispatch,
                           # fall back to capturing a real ERSC type-5's on-wire bytes. See docs/STATE.md > Next.
instrument_type5_recv = true # ★ RECEIVE-SIDE TYPE-5 DE-RISK (2026-07-06, run-16 follow-up) — read-only hook on the
                           # type-5 validator 0x142402ee0 (DLNW3D conn vtable slot 17, reached ONLY from the pump's
                           # type-5 dispatch case). Fires iff a delivered type-5 reaches the pump. THE DIAGNOSTIC:
                           # if TYPE5-VALIDATOR FIRED never appears in the log ⇒ the type-5 is never DELIVERED (falls
                           # through to find-or-create admit; no SteamConnection registered for the peer — the fix is
                           # connection registration). If it FIRES but member+0x152 stays 0 (capture-endpoint.py) ⇒
                           # delivery works, the wall is VALIDATION (BeginAuthSession rejects — ticket-timing or a
                           # conn+0x80 identity mismatch). Role-independent (both machines receive). See docs/STATE.md > Next.
register_peer_connection = true # ★ LOCAL DELIVERY LEVER (2026-07-12): capture the peer endpoint's callback
                           # descriptor using the native builder's endpoint-field mapping, then call the live manager's
                           # 0x14263fd10 registrar once at the next 0x142640bc0 worker entry. Solo verifier:
                           # returned slot non-null, free 5->4, active 0->1, slot owner/key/vtable correct,
                           # and the game remains stable. Off in normal configs; see docs/STATE.md > Next.
suppress_leave = true      # HOLD-HOST test (2026-07-04 pm): the driven host forms (protocol=Ingame, player,
                           # warp) then resets via host-setup's OWN online-availability gate 0x140de2620. When on,
                           # force that gate true (mov al,1; ret) to bypass the online signal — testing whether
                           # the host then STICKS + warps into the co-op map. See SESSION-DRIVE.md > "HOST-SETUP DRIVE".
presence_probe = true      # ★ PRESENCE CHECK (2026-07-25): does the proven `players=2` session roster actually put
                           # a remote CHARACTER in the world? Logs a ~1/sec player_chr_set roster (tag, load status,
                           # update type, Havok position, block, distance moved) + spawn/despawn/status edges, all
                           # under the `presence-probe:` prefix. Enable on BOTH machines: inject movement on one and
                           # diff `moved=`/`dist=` on the other to prove replication. Positions are Havok space, so
                           # dist/moved print `n/a` across a block change rather than a misleading number.
look_at_phantom = true     # ★ PAIRS WITH presence_probe: aim the game's camera at a loaded phantom (via
                           # chr_cam.death_cam_target + DeathCam) so `rig.sh shot` frames the peer wherever the save
                           # left the local character facing. Its `look-at CONFIRM` line also answers
                           # docs/SPECTATE.md > "Rig asks" #1 from the log. Conflicts with
                           # gameplay.always_spectate_on_death (same two fields) — that's false above, so no clash.

# Death-debuff stacking tuning (the on/off toggle is gameplay.death_debuffs). Each death adds the next
# tier up to max_tiers; deaths past that intensify potency by intensity_step_percent each, capped at
# max_intensity_percent. These are the defaults, here for visibility while we RE the death/grace signals.
[death_debuffs]
max_tiers = 5
intensify_past_cap = true
intensity_step_percent = 50
max_intensity_percent = 300

# Lock the in-game time of day (a permanent day/night setting). Off by default; flip `lock` and pick
# hour/minute (also adjustable live in the overlay menu). Handy for solo testing.
[world_time]
lock = false
hour = 12
minute = 0

# Nameplates: `enabled = true` draws the native CSEzDraw disc over each player (and your own head, so
# it's visible solo) — a per-player colored dot, the one nameplate surface. On by default; set `false`
# to turn the dots off. (Listed explicitly to pin the default; the imgui projected-label nameplates
# were removed.)
[nameplates]
enabled = true
